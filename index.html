<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Cadastro de Alunos</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Sistema de Cadastro de Alunos</h1>
    </header>

    <main>
        <section>
            <h2>Cadastrar aluno</h2>

            <form id="formAluno">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite o nome do aluno" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="Digite o e-mail do aluno" required>
                <label for="curso">Curso:</label>

                <select id="curso" required>
                    <option value="">Selecione um curso</option>
                    <option value="ads">
                        Análise e Desenvolvimento de Sistemas
                    </option>
                    <option value="si">
                        Sistemas de Informação
                    </option>
                </select>
                <button type="submit">Cadastrar</button>
            </form>
        </section>

        <section>
            <h2>Alunos cadastrados</h2>

            <ul id="listaAlunos"></ul>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
